# SonarQube project configuration — screenshot-triage
# Analysis is local (self-hosted instance at http://localhost:9000).
# Authentication: SONAR_TOKEN env var — never hardcode tokens here.
sonar.projectKey=screenshot-triage
sonar.projectName=screenshot-triage
sonar.sourceEncoding=UTF-8

sonar.host.url=http://localhost:9000
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
